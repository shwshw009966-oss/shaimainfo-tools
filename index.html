<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شيماء للأدوات - فحص الروابط</title>

<meta name="description" content="أداة مجانية لفحص الروابط وتحليل بعض العلامات التي قد تشير إلى رابط مشبوه.">

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:linear-gradient(135deg,#6c4cff,#8b5cf6);
color:white;
text-align:center;
padding:40px 15px;
}

header h1{
margin:0 0 10px;
font-size:30px;
}

header p{
margin:0;
font-size:16px;
}

.container{
max-width:700px;
margin:35px auto;
padding:0 15px;
}

.box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h2{
text-align:center;
margin-top:0;
}

.description{
text-align:center;
color:#666;
line-height:1.8;
}

input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin:15px 0;
direction:ltr;
text-align:left;
outline:none;
}

input:focus{
border-color:#6c4cff;
}

.buttons{
display:flex;
gap:10px;
}

button{
flex:1;
padding:14px;
border:0;
border-radius:12px;
background:#6c4cff;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#5638e8;
}

.clear{
background:#777;
}

.clear:hover{
background:#555;
}

#result{
margin-top:20px;
padding:18px;
border-radius:12px;
display:none;
line-height:1.8;
}

.safe{
background:#e8f8ee;
color:#176b35;
}

.warning{
background:#fff5df;
color:#805500;
}

.danger{
background:#ffe8e8;
color:#a11;
}

.note{
margin-top:20px;
padding:15px;
background:#f1f1f1;
border-radius:12px;
font-size:14px;
line-height:1.8;
color:#555;
}

footer{
text-align:center;
padding:30px;
color:#777;
}

ul{
padding-right:20px;
}
</style>
</head>

<body>

<header>

<h1>🛡️ شيماء للأدوات</h1>

<p>فحص الروابط قبل فتحها</p>

</header>

<div class="container">

<div class="box">

<h2>🔗 فاحص الروابط</h2>

<p class="description">
الصق الرابط هنا وسنحلل بعض العلامات التي قد تشير إلى أنه مشبوه.
</p>

<input
id="urlInput"
type="text"
placeholder="https://example.com"
autocomplete="off"
>

<div class="buttons">

<button onclick="scanURL()">
🔍 فحص الرابط
</button>

<button class="clear" onclick="clearScan()">
🗑️ مسح
</button>

</div>

<div id="result"></div>

<div class="note">

⚠️ هذا الفحص يقدم تحليلًا مبدئيًا فقط، ولا يضمن أن الموقع آمن بنسبة 100%.

لا تفتح الروابط المشبوهة ولا تدخل كلمات المرور أو البيانات البنكية فيها.

</div>

</div>

</div>

<footer>

© 2026 شيماء للأدوات

</footer>

<script>

function scanURL(){

const input=document.getElementById("urlInput");
const result=document.getElementById("result");

let value=input.value.trim();

if(!value){

result.className="danger";

result.style.display="block";

result.innerHTML="❌ الرجاء إدخال رابط أولًا.";

return;

}

if(!/^https?:\/\//i.test(value)){
value="https://"+value;
}

let url;

try{

url=new URL(value);

}catch(e){

result.className="danger";

result.style.display="block";

result.innerHTML=
"❌ الرابط غير صحيح.<br>تأكد من كتابة الرابط بشكل صحيح.";

return;

}

let warnings=[];
let good=[];

const hostname=url.hostname.toLowerCase();


// HTTPS

if(url.protocol==="https:"){

good.push("🔒 يستخدم اتصال HTTPS.");

}else{

warnings.push("⚠️ الرابط لا يستخدم HTTPS.");

}


// IP address

const ipPattern=/^(\d{1,3}\.){3}\d{1,3}$/;

if(ipPattern.test(hostname)){

warnings.push(
"⚠️ الرابط يستخدم عنوان IP بدل اسم نطاق."
);

}


// @ symbol

if(value.includes("@")){

warnings.push(
"⚠️ الرابط يحتوي على الرمز @ وقد يكون ذلك مؤشرًا مشبوهًا."
);

}


// Punycode

if(hostname.includes("xn--")){

warnings.push(
"⚠️ اسم النطاق يستخدم Punycode وقد يخفي أحرفًا مشابهة."
);

}


// كثيرة النطاقات الفرعية

const parts=hostname.split(".");

if(parts.length>=5){

warnings.push(
"⚠️ يحتوي اسم النطاق على عدد كبير من النطاقات الفرعية."
);

}


// كلمات مشبوهة

const suspiciousWords=[
"login",
"verify",
"verification",
"secure",
"account",
"password",
"update",
"wallet",
"bonus",
"free",
"gift",
"claim",
"bank"
];

let foundWords=[];

for(let word of suspiciousWords){

if(hostname.includes(word)){

foundWords.push(word);

}

}

if(foundWords.length>=2){

warnings.push(
"⚠️ يحتوي اسم النطاق على كلمات تستخدم أحيانًا في روابط التصيد."
);

}


// طول الرابط

if(value.length>200){

warnings.push(
"⚠️ الرابط طويل جدًا."
);

}


// رموز مشفرة

if(value.includes("%")){

warnings.push(
"⚠️ يحتوي الرابط على رموز مشفرة."
);

}


// شرطات كثيرة

const hyphens=(hostname.match(/-/g)||[]).length;

if(hyphens>=4){

warnings.push(
"⚠️ يحتوي اسم النطاق على عدد كبير من الشرطات."
);

}


// منفذ غير معتاد

if(
url.port &&
url.port!=="80" &&
url.port!=="443"
){

warnings.push(
"⚠️ الرابط يستخدم منفذًا غير معتاد."
);

}


// حساب النتيجة

let score=100;

score-=warnings.length*15;

if(score<0){
score=0;
}


// تحديد الحالة

let status="";
let className="";

if(warnings.length===0){

status="🟢 لا توجد علامات مشبوهة واضحة";

className="safe";

}else if(warnings.length<=2){

status="🟡 توجد علامات تحتاج إلى الانتباه";

className="warning";

}else{

status="🔴 توجد عدة علامات مشبوهة";

className="danger";

}


// الملاحظات

let warningHTML="";

if(warnings.length){

warningHTML="<h3>⚠️ الملاحظات:</h3><ul>";

warnings.forEach(function(item){

warningHTML+="<li>"+item+"</li>";

});

warningHTML+="</ul>";

}else{

warningHTML=
"<p>لم نجد علامات مشبوهة واضحة في الرابط.</p>";

}


// النقاط الجيدة

let goodHTML="";

if(good.length){

goodHTML="<h3>✅ نقاط جيدة:</h3><ul>";

good.forEach(function(item){

goodHTML+="<li>"+item+"</li>";

});

goodHTML+="</ul>";

}


// عرض النتيجة

result.className=className;

result.style.display="block";

result.innerHTML=

'<h3>'+status+'</h3>'+

'<p><b>درجة التحليل:</b> '+score+'/100</p>'+

'<p><b>النطاق:</b> '+hostname+'</p>'+

'<p><b>البروتوكول:</b> '+
url.protocol.replace(":","").toUpperCase()+
'</p>'+

goodHTML+

warningHTML;

}


// زر المسح

function clearScan(){

document.getElementById("urlInput").value="";

const result=document.getElementById("result");

result.style.display="none";

result.innerHTML="";

}

</script>

</body>
</html>
