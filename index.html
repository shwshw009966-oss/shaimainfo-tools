<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شيماء للأدوات - فحص الروابط</title>
<meta name="description" content="أداة مجانية لفحص الروابط والتحقق من صحة الرابط قبل فتحه.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:linear-gradient(135deg,#6c4cff,#8b5cf6);
color:white;
text-align:center;
padding:40px 15px;
}

header h1{
margin:0 0 10px;
font-size:30px;
}

header p{
margin:0;
font-size:16px;
}

.container{
max-width:700px;
margin:35px auto;
padding:0 15px;
}

.box{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h2{
text-align:center;
margin-top:0;
}

input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin:15px 0;
direction:ltr;
text-align:left;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:#6c4cff;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#5638e8;
}

#result{
margin-top:20px;
padding:15px;
border-radius:12px;
display:none;
line-height:1.8;
}

.info{
background:#eef2ff;
color:#333;
}

.safe{
background:#e8f8ee;
color:#176b35;
}

.error{
background:#ffecec;
color:#a11;
}

footer{
text-align:center;
padding:30px;
color:#777;
}
</style>
</head>

<body>

<header>
<h1>🛠️ شيماء للأدوات</h1>
<p>أدوات مجانية وسهلة الاستخدام</p>
</header>

<div class="container">

<div class="box">

<h2>🔗 فاحص الروابط</h2>

<p>
أدخل الرابط الذي تريد التحقق من صحته قبل فتحه.
</p>

<input
id="urlInput"
type="url"
placeholder="https://example.com"
autocomplete="off"
>

<button onclick="checkURL()">فحص الرابط</button>

<div id="result"></div>

</div>

</div>

<footer>
© 2026 شيماء للأدوات
</footer>

<script>

function checkURL(){

const input=document.getElementById("urlInput");
const result=document.getElementById("result");

const url=input.value.trim();

result.style.display="block";

if(!url){

result.className="error";
result.innerHTML="❌ الرجاء إدخال رابط أولًا.";
return;

}

try{

const parsed=new URL(url);

if(parsed.protocol !== "http:" && parsed.protocol !== "https:"){

result.className="error";
result.innerHTML="❌ الرابط يجب أن يبدأ بـ http أو https.";
return;

}

result.className="safe";

result.innerHTML=
"✅ الرابط من حيث الصيغة صحيح.<br><br>"+
"🌐 النطاق: <b>"+parsed.hostname+"</b><br>"+
"🔒 البروتوكول: <b>"+parsed.protocol.replace(":","").toUpperCase()+"</b><br><br>"+
"⚠️ ملاحظة: صحة صيغة الرابط لا تعني أن الموقع آمن 100٪.";

}catch(e){

result.className="error";
result.innerHTML="❌ الرابط غير صحيح. تأكدي من كتابته بالشكل الصحيح.";

}

}

</script>

</body>
</html>
